[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend - FastAPI AI trading workstation server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "litellm>=1.98.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]
demo = [
    "rich>=13.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
